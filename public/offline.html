<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6419FF">
    <title>Sin conexión · MR-Lana ERP</title>
    <style>
        :root { color-scheme: light dark; --bg: #F7F6FB; --card: #fff; --text: #1C1830; --muted: #6B6880; --btn: #6419FF; --btn-fg: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #141120; --card: #1C1830; --text: #F1EFF8; --muted: #A9A4BD; --btn: #AA81FE; --btn-fg: #141120; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
               font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
               box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-size: 1.25rem; margin: 20px 0 8px; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
        button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="MR-Lana">
        <h1>Sin conexión a internet</h1>
        <p>El ERP necesita conexión para mostrar información actualizada. Revisa tu red e intenta de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
